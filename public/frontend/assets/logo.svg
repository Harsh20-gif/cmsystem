<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#008736" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152B68" />
      <stop offset="100%" stop-color="#0B1A44" />
    </linearGradient>
  </defs>

  <!-- Top Decorative Arch -->
  <path d="M 168 198 A 140 140 0 0 1 300 52" fill="none" stroke="url(#orangeArc)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 300 52 A 140 140 0 0 1 432 198" fill="none" stroke="url(#greenArc)" stroke-width="8" stroke-linecap="round"/>

  <!-- 3 Stylized People Figures -->
  <!-- Left Person (Orange) -->
  <circle cx="240" cy="130" r="14" fill="#FF6B00" />
  <path d="M 215 175 Q 240 148 262 165 C 255 178 245 188 238 195 Z" fill="#FF6B00" />

  <!-- Middle Person (Blue) -->
  <circle cx="300" cy="108" r="17" fill="#152B68" />
  <path d="M 262 165 Q 300 130 338 165 C 322 192 278 192 262 165 Z" fill="#152B68" />

  <!-- Right Person (Green) -->
  <circle cx="360" cy="130" r="14" fill="#008736" />
  <path d="M 338 165 Q 360 148 385 175 C 375 195 360 188 338 165 Z" fill="#008736" />

  <!-- Bridge Structure -->
  <!-- Upper Arch Rail -->
  <path d="M 125 228 C 220 180 380 180 475 228 L 470 234 C 378 188 222 188 130 234 Z" fill="#152B68" />
  <path d="M 128 236 C 220 190 380 190 472 236 L 468 243 C 378 198 222 198 132 243 Z" fill="#152B68" />

  <!-- Bridge Body & Pillars -->
  <path d="M 180 205 C 240 185 360 185 420 205 L 442 272 L 420 272 L 418 240 C 370 220 230 220 182 240 L 180 272 L 158 272 Z" fill="url(#bridgeGrad)" />

  <!-- Robotics & Tech Circuit Icon (Under Bridge) -->
  <g transform="translate(240, 222) scale(0.6)">
    <!-- Circuit Base -->
    <rect x="70" y="55" width="60" height="40" rx="4" fill="none" stroke="#152B68" stroke-width="3" />
    <circle cx="85" cy="75" r="4" fill="#FF6B00" />
    <circle cx="100" cy="75" r="4" fill="#152B68" />
    <circle cx="115" cy="75" r="4" fill="#008736" />
    <!-- Robotic Arm Left -->
    <path d="M 20 85 L 45 45 L 65 55 L 50 85" fill="none" stroke="#152B68" stroke-width="4" stroke-linejoin="round" />
    <circle cx="45" cy="45" r="5" fill="#FF6B00" />
    <!-- Robotic Arm Right -->
    <path d="M 180 85 L 155 45 L 135 55 L 150 85" fill="none" stroke="#152B68" stroke-width="4" stroke-linejoin="round" />
    <circle cx="155" cy="45" r="5" fill="#008736" />
    <!-- Circuit Lines -->
    <path d="M 100 55 L 100 30 M 80 55 L 80 40 M 120 55 L 120 40" stroke="#152B68" stroke-width="3" />
    <circle cx="100" cy="26" r="3" fill="#152B68" />
    <circle cx="80" cy="36" r="3" fill="#152B68" />
    <circle cx="120" cy="36" r="3" fill="#152B68" />
  </g>

  <!-- Title Text: Skill Bridge India -->
  <text x="300" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="44">
    <tspan fill="#152B68">Skill Bridge </tspan>
    <tspan fill="#008736">India</tspan>
  </text>

  <!-- Sub-Title: Technologies with side lines -->
  <line x1="70" y1="380" x2="170" y2="380" stroke="#152B68" stroke-width="2" />
  <text x="300" y="388" text-anchor="middle" fill="#152B68" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="24" letter-spacing="4">Technologies</text>
  <line x1="430" y1="380" x2="530" y2="380" stroke="#152B68" stroke-width="2" />

  <!-- Slogan: LEARN • GROW • SUCCEED -->
  <text x="300" y="428" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="19" letter-spacing="6">
    <tspan fill="#FF6B00">LEARN </tspan>
    <tspan fill="#152B68">• GROW • </tspan>
    <tspan fill="#008736">SUCCEED</tspan>
  </text>

  <!-- Tagline: Training | Skilling | Placement -->
  <text x="300" y="465" text-anchor="middle" fill="#152B68" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="20" letter-spacing="2">
    Training  |  Skilling  |  Placement
  </text>
</svg>
